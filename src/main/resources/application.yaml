spring:
  application:
    name: vesanre-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPORTHUB_DB_URL}
    username: ${SPORTHUB_DB_USERNAME}
    password: ${SPORTHUB_DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origin: ${SPORTHUB_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  security:
    jwt:
      secret: ${SPORTHUB_JWT_SECRET}
      issuer: ${SPORTHUB_JWT_ISSUER:sporthub}
      access-token-ttl-seconds: ${SPORTHUB_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
